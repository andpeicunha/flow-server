name: flow-pr-review
description: Pravaler PR review proporcional ao impacto de negócio (triagem de risco com tiers), read-only, com Skills por superfície, triagem humana dos achados, validação cética, rascunhos de comentários aprovados pelo usuário e publicação do review com guarda de head e aprovação explícita
routing:
  when: [pr, pull request, review, revisar, revise, revisão, analise, analisar, diff]
  avoid: [implement, sdd]
  priority: 30

stopWhen:
  - step: repo_preflight
    jsonPath: status
    notEquals: pass
    status: wrong_repo_or_flow
    next: switch to a Pravaler repo or provide PR/repo details
  - step: review_findings_backend_standard
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_backend_standard; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: review_findings_backend_deep
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_backend_deep; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: review_findings_frontend_standard
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_frontend_standard; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: review_findings_frontend_deep
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_frontend_deep; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: review_findings_design_system_standard
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_design_system_standard; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: review_findings_design_system_deep
    jsonPath: status
    notEquals: pass
    status: needs_review_resolution
    mode: block
    next: 'inspecione o receipt degradado de review_findings_design_system_deep; após resolver a causa rode flow_continue (re-executa o nó); não aceite resultado degradado como review'
  - step: risk_triage
    jsonPath: status
    notEquals: pass
    status: needs_triage_data
    mode: block
    next: 'inspecione o receipt de risk_triage (campo missing); após fornecer o dado que falta rode flow_continue (re-executa o nó)'
  - step: review_closeout
    jsonPath: headCheck
    notEquals: current
    status: stale_head
    next: 'rode o flow-pr-review de novo no head atual'
  # publish_review: o prompt devolve blockedReason em todo receipt completed (none|head_changed|transient_error).
  # head_changed e terminal (stop). transient_error (falha transitoria do gh, nada publicado) vira block:
  # flow_continue re-executa o no. Se o no gravar receipt failed, o servidor ja bloqueia por
  # NODE_FAILED/DEPENDENCY_FAILED e o caminho e flow_retry_node; stopWhen nao e avaliado nesse caso.
  - step: publish_review
    jsonPath: blockedReason
    equals: head_changed
    status: head_changed_before_publish
    next: 'o head do PR mudou antes da publicacao; nada foi publicado; rode o flow-pr-review de novo no head atual'
  - step: publish_review
    jsonPath: blockedReason
    equals: transient_error
    status: publish_transient_error
    mode: block
    next: 'inspecione o receipt (nada foi publicado); apos resolver a causa do erro do gh rode flow_continue (re-executa o no)'

nodes:
  - id: repo_preflight
    agent: explorer
    model: anthropic/claude-haiku-5-5
    variant: low
    executor: cli-session
    output: Confirm the Pravaler worktree and review surface.
    prompt: |
      Faça preflight read-only somente no workspace alvo informado pelo runner.
      O diretório de invocação pode ser diferente. Tarefa: {{task}}
      Verifique marcadores locais Pravaler sem editar arquivos:
      - Backend NestJS (Clean Architecture): package.json + src/domain/, src/application/, src/infrastructure/ (ex.: auth-service, lead-service, proposal-service, orch-service, lib-logger).
      - Frontend MFE (Vite + Module Federation): vite.config.ts + dependência @module-federation/vite + src/ (ex.: pip-core, pip-fin-fundos, pip-fin-fundos-v2).
      - Frontend Next.js: next.config.* + src/ ou app/ (ex.: canais-front, descoberta-pdp-frontend).
      - Design System (Turbo+PNPM monorepo): turbo.json + pnpm-workspace.yaml + pacotes @pravaler/prv-ds* (tokens, ícones, componentes). Exemplo: prv-design-system.
      Não troque de worktree e não edite arquivos.
      Use status=blocked somente se os marcadores forem insuficientes; caso contrário use pass.
      Não explique o raciocínio. Retorne somente este objeto JSON entre os marcadores exigidos:
      { "status": "pass|blocked", "repoType": "backend|frontend-mfe|frontend-nextjs|design-system|unknown", "reason": "...", "missing": [] }

  - id: pr_intake
    after: [repo_preflight]
    agent: oracle
    model: anthropic/claude-sonnet-5-5
    variant: low
    executor: cli-session
    output: Identify PR, base/head, declared scope, existing review comments, and cross-repo dependencies.
    prompt: |
      Colete intake do PR sem editar arquivos.
      Tarefa: {{task}}
      Superfície: {{step.repo_preflight}}
      Identifique PR/base/head, objetivo, arquivos/áreas prováveis, critérios de aceite,
      dependências do outro repositório e dados faltantes.
      Leia os comentários já existentes somente para saber o que já foi dito e não duplicar achados:
      - gh api repos/<owner>/<repo>/pulls/<N>/comments (comentários inline)
      - gh api repos/<owner>/<repo>/issues/<N>/comments (comentários gerais)
      - gh api repos/<owner>/<repo>/pulls/<N>/reviews (apenas corpos NÃO vazios de reviews)
      NÃO registre nem reporte estados de review, approves, nomes de quem já revisou/aprovou, contagens ou reviews vazios; isso é irrelevante e não deve influenciar a análise nem os riscos.
      Registre `state` da PR (OPEN|MERGED|CLOSED). PR já mergeada ou fechada continua sendo revisada normalmente; apenas registre o estado, não bloqueie.
      Registre `headRefOid` (SHA do head atual), `author` (login do autor do PR) e
      `existingComments` (resumo curto do conteúdo: path/linha/tema de cada comentário).
      Retorne JSON com status, pr, state (OPEN|MERGED|CLOSED), headRefOid, author, scope, affectedRepos, existingComments,
      missing, risks e next.

  - id: diff_recon
    after: [pr_intake]
    agent: oracle
    model: anthropic/claude-sonnet-5-5
    variant: low
    executor: cli-session
    output: Recon the diff and classify review risks without editing.
    prompt: |
      Analise diff/status/arquivos relevantes de forma read-only.
      Tarefa: {{task}}
      Intake: {{step.pr_intake}}
      Classifique impacto em contrato, segurança, performance e escopo.
      Liste em `qualitySignals` os arquivos de produção com mais linhas adicionadas, os módulos novos e
      se o diff toca API pública de pacote publicado.
      Retorne somente JSON válido:
      { "status": "pass|blocked", "summary": "...", "repoType": "backend|frontend-mfe|frontend-nextjs|design-system", "contractImpact": true, "securityImpact": true, "performanceImpact": true, "affectedAreas": [], "qualitySignals": { "largestFiles": [{"path":"...","addedLines":0}], "newModules": [], "publicApiTouched": false }, "risks": [], "filesReviewed": [], "commandsRun": [], "next": "continue|stop" }

  - id: risk_triage
    after: [diff_recon]
    agent: oracle
    model: anthropic/claude-haiku-5-5
    variant: low
    executor: cli-session
    output: Classify the PR tier by business impact and choose the review route.
    prompt: |
      Classifique o PR por IMPACTO DE NEGÓCIO, não por tamanho. Read-only.
      Tarefa: {{task}}
      Intake: {{step.pr_intake}}
      Recon: {{step.diff_recon}}
      Sinais de negócio (qualquer um força tier >= medium): toca proposta, jornada, contrato,
      financiamento, pagamento, garantidor, oferta/SKU; muda status/transições ou executa ação
      irreversível; altera contrato de API, eventos Pub/Sub ou migration; mexe em auth/segurança,
      config de deploy ou lib compartilhada; afeta vários consumidores.
      Tamanho (linhas/arquivos) é só sinal secundário; ignore lockfile, openspec e docs na contagem.
      Sinais de alto impacto => tier high: ação irreversível, dinheiro, auth, migration em tabela
      grande, contrato público ou evento consumido por outros serviços.
      Sem sinais de negócio e com diff pequeno/localizado => low.
      Superfície: backend (repoType backend), frontend (frontend-mfe e frontend-nextjs) ou design-system.
      `route` = "<surface>-<tier>" (ex.: backend-low, frontend-medium, design-system-high).
      Ignore quem já aprovou/revisou a PR e quantos approves existem; revise o diff de forma independente e considere apenas o conteúdo dos comentários existentes.
      status=blocked SOMENTE quando falta dado para classificar (intake/recon ausente, vazio ou ilegível,
      superfície indeterminável); liste o que falta em `missing`. Risco incerto NÃO é blocked: classifique pelo
      sinal mais forte (na dúvida, tier maior). status=pass EXIGE `route`, `tier` e `surface`; o receipt sem
      eles é rejeitado.
      Retorne somente JSON válido:
      { "status": "pass|blocked", "tier": "low|medium|high", "surface": "backend|frontend|design-system", "route": "<surface>-<tier>", "businessSignals": [], "reasons": [], "sizeNote": "...", "missing": [] }
    outputSchema:
      type: object
      required: [status]
      properties:
        status: { enum: [pass, blocked] }
        tier: { enum: [low, medium, high] }
        surface: { enum: [backend, frontend, design-system] }
        route: { type: string, pattern: "^(backend|frontend|design-system)-(low|medium|high)$" }
        missing: { type: array, items: { type: string } }
      if:
        properties: { status: { const: pass } }
        required: [status]
      then:
        properties: { route: { type: string }, tier: { type: string }, surface: { type: string } }
        required: [route, tier, surface]

  - id: review_findings_backend_standard
    after: [diff_recon, risk_triage]
    when: { step: risk_triage, jsonPath: route, in: [backend-low, backend-medium] }
    agent: test-auditor
    model: anthropic/claude-sonnet-5-5
    variant: medium
    executor: cli-session
    skills: [prv-review-guidelines, review-confidence, test-evidence-audit, minimal-solution-review]
    constraints:
      - Operar estritamente read-only.
      - Não declarar comandos executados sem registrá-los no receipt estruturado.
      - Se o modelo ficar indisponível, tentar retry bounded e modelo compatível alternativo.
      - No Codex, usar codex-multi-auth somente se essa capacidade estiver disponível.
      - Se todos os fallbacks falharem, retornar status=degraded e reducedConfidence=true.
      - 'degraded SOMENTE para falha de modelo/ferramenta. Teste, suíte ou mutação não executados NÃO são degraded: status=pass, reducedConfidence=true e missingEvidence[] com o motivo de cada item.'
    output: Review backend findings using the applicable Skills.
    prompt: |
      Revise este PR backend usando as Skills carregadas, sem editar arquivos.
      Tarefa: {{task}}
      Intake: {{step.pr_intake}}
      Recon: {{step.diff_recon}}
      Triagem de risco: {{step.risk_triage}}
      Antes de revisar, leia quando existirem no repositório: openspec/project.md, openspec/changes/
      (mudanças recentes relevantes ao diff), docs/adrs/ ou adrs/ (ADRs aplicáveis às áreas tocadas
      pelo diff), docs/guidelines/. Não é obrigatório ler tudo — priorize o que for relevante ao
      escopo do diff.
      Cubra limites de domínio, persistência, HTTP/DTOs, contratos front-back,
      segurança, performance, escopo e testes. Não transforme regras da Skill em checklist
      artificial: aplique somente o que for relevante ao diff.
      Regras de qualidade dos achados:
      - Confiança: aplique review-confidence. Só vira finding com confiança >= 80; o restante vai para `nits`.
      - Severidade P0..P3 pelo que a falha FAZ (cenário de falha concreto), nunca por querer ou não o merge.
      - Falha que já existia na base (não introduzida pelo diff): marque `preexisting: true`.
      - FILTRO DE RUÍDO — não reporte: checklist/evidência vazia da descrição do PR, ordem de merge/deploy,
        nome de branch, casos de borda improváveis, animação/estética menor, dependências de backend,
        e pontos baseados só na descrição da PR sem evidência no código.
      - Cada finding tem id estável F1..Fn, `confidence` (0-100), `anchor` {path, line, side: "RIGHT"}
        dentro de um hunk do diff quando houver, `failureScenario` (cenário concreto; em achado de
        desenho, `cost` e `minimalAlternative`) e `suggestion`
        (inclua na `recommendation`; use `suggestion` como trecho/ação curta).
      - Não duplique o que já está em `existingComments` do intake (comentários/reviews existentes).
      Ignore quem já aprovou/revisou a PR e quantos approves existem; revise o diff de forma independente e considere apenas o conteúdo dos comentários existentes.
      DESENHO DA SOLUÇÃO: aplique ao diff os seis critérios da Skill minimal-solution-review (invariante
      existente, custo de cada peça nova, alternativa mínima, mitigação de efeito colateral, casos
      equivalentes, change OpenSpec). Achado de desenho usa `kind: "design"`: no lugar de
      `failureScenario`, preencha `cost` e `minimalAlternative`; confiança >= 80 exige `arquivo:linha`
      da garantia existente ou da alternativa; severidade no máximo P2. Os demais achados usam
      `kind: "defect"`. Guarda fail-closed em fronteira de segurança (authz, identidade, origem, limites)
      nunca é redundância. Registre `changeCheck` conforme a Skill; sem ele o review é INCOMPLETO.
      Forma do código (tamanho, duplicação, nomes, tipos) é de outro nó: não reporte aqui.
      EVIDÊNCIA NÃO EXECUTADA: este nó é read-only. Se não rodou suíte/teste/mutação (ou não pôde), isso NÃO é degraded:
      retorne status=pass, reducedConfidence=true e liste cada item em `missingEvidence` como
      {"item":"...","reason":"..."} (ex.: "mutação do guard X", "reason": "nó read-only"). Use status=degraded
      somente se o modelo ou uma ferramenta essencial falhou e não há findings utilizáveis.
      Carregue as Skills declaradas: use a ferramenta Skill se estiver disponível; caso contrário, leia o SKILL.md (e references/ quando existir) em ~/.agents/skills/<nome>/ ou ~/.claude/skills/<nome>/ e aplique ao diff.
      Retorne somente JSON válido:
      { "status": "pass|degraded", "reducedConfidence": false, "findings": [{"id":"F1","kind":"defect|design","severity":"P0|P1|P2|P3","confidence":0,"title":"...","evidence":"...","failureScenario":"...","cost":"...","minimalAlternative":"...","impact":"...","recommendation":"...","suggestion":"...","anchor":{"path":"...","line":0,"side":"RIGHT"},"preexisting":false}], "nits": [], "changeCheck": {"required":false,"found":"openspec/changes/<id>|none|n/a","reason":"..."},"commandsRun": [{"command":"...","result":"passed|failed","evidence":"..."}], "missingEvidence": [{"item":"...","reason":"..."}], "risks": [], "next": "continue|stop" }

  - id: review_findings_backend_deep
    after: [diff_recon, risk_triage]
    when: { step: risk_triage, jsonPath: route, equals: backend-high }
    agent: test-auditor
    model: anthropic/claude-opus-5-5
    variant: medium
    executor: cli-session
    skills: [prv-review-guidelines, review-confidence, test-evidence-audit, minimal-solution-review]
