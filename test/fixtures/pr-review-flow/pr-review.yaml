  - id: review_findings_frontend_standard
    after: [diff_recon, risk_triage]
    when: { step: risk_triage, jsonPath: route, in: [frontend-low, frontend-medium] }
    agent: test-auditor
    model: anthropic/claude-sonnet-5-5
    variant: medium
    executor: cli-session
    skills: [prv-review-guidelines-front, review-confidence, test-evidence-audit, minimal-solution-review]
    constraints:
