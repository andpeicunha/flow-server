  - id: code_quality_review
    after: [diff_recon, risk_triage]
    when: { step: risk_triage, jsonPath: tier, in: [medium, high] }
    agent: oracle
    model: anthropic/claude-sonnet-5-5
    variant: medium
    executor: cli-session
    skills: [code-quality-review]
    constraints:
      - Operar estritamente read-only.
      - Não reportar correção, segurança, performance nem desenho da solução; outro nó cobre.
      - Se o modelo ficar indisponível e os fallbacks falharem, retornar status=degraded.
    output: Review de simplicidade, legibilidade e manutenção do diff.
    prompt: |
      Revise SOMENTE a forma do código deste PR, sem editar arquivos.
      Correção, segurança e performance já são cobertas por outro nó: não reporte bugs aqui.
      Se uma peça deveria existir (query, porta, dependência, guarda) também é de outro nó:
      tome o desenho como dado.
      A pergunta é uma só: o código que existe está na forma mais simples, legível e fácil
      de manter?
      Tarefa: {{task}}
      Intake: {{step.pr_intake}}
      Recon: {{step.diff_recon}}
      Triagem de risco: {{step.risk_triage}}

      Método (nesta ordem):
      1. Leia por inteiro cada arquivo de produção tocado pelo diff, não só os hunks.
         Dos testes, leia os helpers e a estrutura (describe/it); leia o corpo quando um
         gatilho de teste disparar.
      2. Meça antes de opinar. Para cada arquivo de produção registre em `metrics`:
         linhas, maior função (nome e linhas), maior aninhamento, nº de `let` na maior closure.
      3. Percorra os critérios da Skill code-quality-review (universais + os da superfície:
         backend, frontend, testes). Para cada critério registre em `criteria`:
         "finding", "ok" ou "n/a". Critério sem registro torna o review incompleto.
      4. Um gatilho atingido NÃO é finding automático. Só vira finding se você conseguir
         escrever a versão mais simples e dizer o que ela remove (linhas, ramos, mocks,
         tipos, cópias).
      5. Procure o que já existe: antes de propor helper, tipo ou dependência, verifique no
         repo se há equivalente (grep) e cite o caminho.

      Regras dos achados:
      - id estável Q1..Qn; `anchor` {path, line, side: "RIGHT"} dentro de um hunk quando houver.
      - `problem`: o que custa manter, em 1-2 frases, com números quando houver.
      - `simplerVersion`: trecho curto (até 15 linhas) ou a ação exata. Obrigatório.
      - `removes`: o que some com a mudança.
      - `impact`: alto | medio | baixo. `when`: before_merge | follow_up, pelos critérios da Skill.
      - `behaviorChange`: false sempre que possível; se true, explique e rebaixe para follow_up.
      - `preexisting`: true se o diff só acrescentou mais uma cópia de algo que já existia.
      - `hypothesis`: true quando o achado afirma que um teste ou guarda fica desnecessário;
        nesse caso `when` é follow_up.
      - Antes de classificar teste como repetição de constante, procure o valor em openspec/,
        ADRs e contratos. Valor fixado por spec é teste de conformidade: não reporte.
      - Guarda fail-closed em authz, identidade, origem ou limites: nunca proponha remover.
      - Máximo 8 findings, ordenados por impacto. O excedente vai em `overflow` só com título.
      - NÃO reporte: o que lint/formatter cobre; preferência sem ganho mensurável; item sem
        simplerVersion; item já presente em existingComments.
      - Registre em `keep` até 3 decisões boas do diff que não devem ser desfeitas num
        refactor (uma linha cada). Não é elogio: é proteção contra regressão de desenho.

      Carregue a Skill declarada: use a ferramenta Skill se estiver disponível; caso contrário, leia o SKILL.md em ~/.agents/skills/<nome>/ ou ~/.claude/skills/<nome>/ e aplique ao diff.
      Retorne somente JSON válido:
      { "status": "pass|degraded", "metrics": [{"path":"...","lines":0,"largestFunction":{"name":"...","lines":0},"maxNesting":0,"mutableInClosure":0}], "criteria": {"Q1":"finding|ok|n/a"}, "findings": [{"id":"Q1","criterion":"Q3","impact":"alto|medio|baixo","when":"before_merge|follow_up","title":"...","problem":"...","simplerVersion":"...","removes":"...","behaviorChange":false,"preexisting":false,"hypothesis":false,"anchor":{"path":"...","line":0,"side":"RIGHT"}}], "overflow": [], "keep": [], "commandsRun": [{"command":"...","result":"passed|failed","evidence":"..."}] }

